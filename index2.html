<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    color: #222;
}

.contenedor {
    width: 94%;
    max-width: 650px;
    margin: auto;
    padding: 18px 0 30px;
}

h1 {
    text-align: center;
    margin: 5px 0 4px;
    font-size: 28px;
}

.subtitulo {
    text-align: center;
    color: #666;
    margin: 0 0 18px;
    font-size: 14px;
}

.area {
    background: white;
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.area h2 {
    margin: 2px 0 12px;
    font-size: 20px;
}

.producto {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 9px 0;
    border-bottom: 1px solid #eee;
}

.producto:last-child {
    border-bottom: none;
}

.nombre {
    flex: 1;
    font-size: 16px;
}

.meta {
    display: block;
    color: #888;
    font-size: 11px;
    margin-top: 2px;
}

input {
    width: 78px;
    height: 42px;
    border: 1px solid #bbb;
    border-radius: 10px;
    text-align: center;
    font-size: 17px;
    background: #fff;
}

.boton {
    width: 100%;
    border: none;
    border-radius: 13px;
    padding: 15px;
    font-size: 17px;
    font-weight: bold;
    background: #222;
    color: white;
    margin-top: 4px;
    cursor: pointer;
}

#mensaje {
    text-align: center;
    margin-top: 12px;
    font-weight: bold;
    min-height: 20px;
}

#resultado {
    width: 100%;
    min-height: 130px;
    margin-top: 12px;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 12px;
    font-size: 16px;
    resize: vertical;
    display: none;
}

@media (max-width: 480px) {
    .contenedor {
        width: 96%;
        padding-top: 12px;
    }

    h1 {
        font-size: 25px;
    }

    .area {
        padding: 12px;
        border-radius: 14px;
    }

    .producto {
        padding: 10px 0;
    }

    .nombre {
        font-size: 15px;
    }

    input {
        width: 74px;
    }
}
</style>
</head>

const nombresAreas = {
    gris: "🩶 Bodega, refri y limpieza",
    morado: "🟣 Bebidas",
    comida: "🍔 Comida"
};

function numeroBonito(numero) {
    if (Number.isInteger(numero)) return numero;
    return Number(numero.toFixed(2));
}

function mostrarProductos(grupo, lugar) {

    const contenedor = document.getElementById(lugar);

    const area = document.createElement("div");
    area.className = "area";

    const titulo = document.createElement("h2");
    titulo.textContent = nombresAreas[grupo];
    area.appendChild(titulo);

    productos
        .filter(producto => producto.group === grupo)
        .forEach((producto, indice) => {

            const fila = document.createElement("div");
            fila.className = "producto";

            const nombre = document.createElement("div");
            nombre.className = "nombre";
            nombre.textContent = producto.name;

            if (producto.target !== null) {
                const meta = document.createElement("span");
                meta.className = "meta";
                meta.textContent = "Meta: " + numeroBonito(producto.target);
                nombre.appendChild(meta);
            }

            const input = document.createElement("input");
            input.type = "number";
            input.min = "0";
            input.step = "any";
            input.inputMode = "decimal";
            input.placeholder = "Tengo";
            input.dataset.producto = producto.name;
            input.dataset.objetivo = producto.target === null ? "" : producto.target;

            input.id = "cantidad_" + grupo + "_" + indice;

            // Guardado automático en ESTE teléfono/navegador.
            const guardado = localStorage.getItem("inventarioFisico_v2_" + input.id);
            if (guardado !== null) {
                input.value = guardado;
            }

            input.addEventListener("input", function() {
                localStorage.setItem("inventarioFisico_v2_" + input.id, input.value);
            });

            fila.appendChild(nombre);
            fila.appendChild(input);
            area.appendChild(fila);
        });

    contenedor.appendChild(area);
}

mostrarProductos("gris", "gris");
mostrarProductos("morado", "morado");
mostrarProductos("comida", "comida");

function generarYCopiar() {

    let lista = [];

    document.querySelectorAll("input[data-producto]").forEach(input => {

        // Si no escribieron nada, se ignora.
        if (input.value === "") return;

        const objetivo = parseFloat(input.dataset.objetivo);
        const tengo = parseFloat(input.value);

        // Productos sin meta definida también se ignoran.
        if (isNaN(objetivo) || isNaN(tengo)) return;

        const falta = objetivo - tengo;

        // Si ya tenemos suficiente, no aparece.
        if (falta <= 0) return;

        lista.push(numeroBonito(falta) + " " + input.dataset.producto);
    });

    const texto = lista.join("\n");
    const mensaje = document.getElementById("mensaje");
    const resultado = document.getElementById("resultado");

    if (texto === "") {
        mensaje.textContent = "No falta nada 😎";
        resultado.style.display = "none";
        return;
    }

    resultado.value = texto;
    resultado.style.display = "block";

    // Copiado automático.
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(texto)
            .then(() => {
                mensaje.textContent = "✅ ¡Lista copiada! Ya puedes pegarla en WhatsApp.";
            })
            .catch(() => copiarAlternativo(texto, mensaje));
    } else {
        copiarAlternativo(texto, mensaje);
    }
}

function copiarAlternativo(texto, mensaje) {
    const resultado = document.getElementById("resultado");
    resultado.style.display = "block";
    resultado.focus();
    resultado.select();

    try {
        document.execCommand("copy");
        mensaje.textContent = "✅ ¡Lista copiada! Ya puedes pegarla en WhatsApp.";
    } catch (e) {
        mensaje.textContent = "📋 La lista está abajo; mantenla presionada para copiarla.";
    }
}
